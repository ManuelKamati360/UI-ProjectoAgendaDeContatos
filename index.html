<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="./css/main.css">
    <script src="./js/consumo-api.js" defer></script>
    <script src="./js/render-cards-contatos.js" defer></script>
    <script src="./js/totalCardsContato.js" defer></script>
    <script src="./js/modalDialogoAdicionarContato.js" defer></script>
    <script src="./js/modalDialogoEditarContato.js" defer></script> 
    <script src="./js/modalDialogoDeletarContato.js" defer></script> 
    <title>Agenda De Contatos</title>
</head>
<body>
    <header id="conteiner-cabecalho">
        <h1>Agenda De Contatos</h1> 

        <nav id="conteiner-buscar-contatos">
            <form action="" method="get" id="frm-buscar-contato">
                <input id="item-txt-caixa-de-busca" type="search" name="search" placeholder="Buscar contato...">
                <button id="item-btn-buscar" type="submit">Buscar</button>
            </form>
        </nav>
    </header>
        
    <main id="conteiner-principal">

        <aside id="conteiner-painel-lateral">
            <div class="item">
                <img src="./img/Bookmark.png" alt="contatos" id="logo-agenda">
                <label for="total" id="total-de-contatos">999.999.999</label>
            </div>
            <div class="item">
                <button type="button" id="btn-adicionar-contato">+</button>                              
            </div>
        </aside>

        <section id="conteiner-painel-central"></section>

    </main>

    <dialog class="modal" id="adicionar">
        <div class="conteiner-modalDialogo">
            <div class="header">
                <h1>Agenda De Contatos</h1>
            </div>

            <form action="" method="post" class="form-modalDialogo" id="form-adicionar">
                <label for="id-nome">Nome</label>
                <input type="text" name="nome" id="id-nome" maxlength="45" placeholder="Digite o nome completo..." autocomplete="off" autofocus required>
                
                <div class="conteiner-codigo-pais">
                    <label for="id-pais" class="item-paises">País</label>
                    <select name="pais" id="id-pais" class="item-paises" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="+244">Angola (+244)</option>
                        <option value="+351">Portugal (+351)</option>
                        <option value="+55">Brasil (+55)</option>
                        <option value="+258">Moçambique (+258)</option>
                        <option value="+238">Cabo Verde (+238)</option>
                        <option value="+245">Guiné-Bissau (+245)</option>
                        <option value="+853">Macau (+853)</option>
                    </select>
                    <label for="id-telefone" class="item-paises" id="telefone">Telefone</label>
                    <input type="tel" maxlength="9" name="telefone" id="id-telefone" class="item-paises" placeholder="Digite o número de telefone..." autocomplete="off" required>
                </div>

                <label for="id-email">E-mail</label>
                <input type="email" name="email" id="id-email" placeholder="Digite o endereço de e-mail..." autocomplete="off" required>

                <label for="id-datanascimento">Data de nascimento</label>
                <input type="date" name="dataNascimento" id="id-datanascimento" required>

                <label for="id-endereco">Endereço</label>
                <input type="text" name="endereco" id="id-endereco" maxlength="45" placeholder="Digite o seu endereço..." required>

                <label for="id-cidade">Cidade</label>
                <input type="text" name="cidade" id="id-cidade" maxlength="45" placeholder="Digite a sua cidade..." required>

                <label for="id-estado">Estado</label>
                <input type="text" name="estado" id="id-estado" maxlength="45" placeholder="Digite o seu estado..." required>
                
                <div class="butoes">
                    <input type="button" value="Adicionar" id="btn-adicionar">
                    <input type="button" value="Cancelar" class="btn-cancelar">
                </div>
            </form>
        </div> 
    </dialog>    

    <dialog class="modal" id="id-modal-editar">
        <div class="conteiner-modalDialogo">
            <div class="header">
                <h1>Agenda De Contatos</h1>
            </div>

            <form action="" method="post" class="form-modalDialogo" id="form-editar">
                <label for="id-nome">Nome</label>
                <input type="text" name="nome" id="id-nome-modalEditar" maxlength="45" placeholder="Digite o nome completo..." autocomplete="off" autofocus required>
                
                <div class="conteiner-codigo-pais">
                    <label for="id-pais" class="item-paises">País</label>
                    <select name="pais" id="id-pais-modalEditar" class="item-paises" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="+244">Angola (+244)</option>
                        <option value="+351">Portugal (+351)</option>
                        <option value="+55">Brasil (+55)</option>
                        <option value="+258">Moçambique (+258)</option>
                        <option value="+238">Cabo Verde (+238)</option>
                        <option value="+245">Guiné-Bissau (+245)</option>
                        <option value="+853">Macau (+853)</option>
                    </select>
                    <label for="id-telefone" class="item-paises" id="telefone">Telefone</label>
                    <input type="tel" maxlength="9" name="telefone" id="id-telefone-modalEditar" class="item-paises" placeholder="Digite o número de telefone..." autocomplete="off" required>
                </div>

                <label for="id-email">E-mail</label>
                <input type="email" name="email" id="id-email-modalEditar" placeholder="Digite o endereço de e-mail..." autocomplete="off" required>

                <label for="id-datanascimento">Data de nascimento</label>
                <input type="date" name="dataNascimento" id="id-datanascimento-modalEditar" required>

                <label for="id-endereco">Endereço</label>
                <input type="text" name="endereco" id="id-endereco-modalEditar" maxlength="45" placeholder="Digite o seu endereço..." required>

                <label for="id-cidade">Cidade</label>
                <input type="text" name="cidade" id="id-cidade-modalEditar" maxlength="45" placeholder="Digite a sua cidade..." required>

                <label for="id-estado">Estado</label>
                <input type="text" name="estado" id="id-estado-modalEditar" maxlength="45" placeholder="Digite o seu estado..." required>
                
                <div class="butoes">
                    <input type="button" value="Salvar" id="id-btn-salvar-modalEditar">
                    <input type="button" value="Cancelar" class="btn-cancelar" id="id-btn-cancelar-modalEditar">
                </div>
            </form>
        </div> 
    </dialog>    

    <dialog class="modal" id="id-modal-deletar">
        <div class="conteiner-modalDialogo">
            <div class="header">
                <h1>Agenda De Contatos</h1>
            </div>

            <form action="" method="post" class="form-modalDialogo" id="form-deletar">
                <label for="id-nome">Nome</label>
                <input type="text" name="nome" id="id-nome" maxlength="45" placeholder="Digite o nome completo..." autocomplete="off" readonly>
                
                <div class="conteiner-codigo-pais">
                    <label for="id-pais" class="item-paises">País</label>
                    <select name="pais" id="id-pais" class="item-paises" readonly>
                        <option value="" disabled selected>Selecione</option>
                        <option value="+244">Angola (+244)</option>
                        <option value="+351">Portugal (+351)</option>
                        <option value="+55">Brasil (+55)</option>
                        <option value="+258">Moçambique (+258)</option>
                        <option value="+238">Cabo Verde (+238)</option>
                        <option value="+245">Guiné-Bissau (+245)</option>
                        <option value="+853">Macau (+853)</option>
                    </select>
                    <label for="id-telefone" class="item-paises" id="telefone">Telefone</label>
                    <input type="tel" name="telefone" id="id-telefone" class="item-paises" placeholder="Digite o número de telefone..." readonly>
                </div>

                <label for="id-email">E-mail</label>
                <input type="email" name="email" id="id-email" placeholder="Digite o endereço de e-mail..." readonly>

                <label for="id-datanascimento">Data de nascimento</label>
                <input type="date" name="dataNascimento" id="id-datanascimento" readonly>

                <label for="id-endereco">Endereço</label>
                <input type="text" name="endereco" id="id-endereco" placeholder="Digite o seu endereço..." readonly>

                <label for="id-cidade">Cidade</label>
                <input type="text" name="cidade" id="id-cidade" placeholder="Digite a sua cidade..." readonly>

                <label for="id-estado">Estado</label>
                <input type="text" name="estado" id="id-estado" placeholder="Digite o seu estado..." readonly>
                
                <div class="butoes">
                    <input type="button" value="Deletar" id="btn-deletar">
                    <input type="button" value="Cancelar" class="btn-cancelar">
                </div>
            </form>
        </div> 
    </dialog>    

</body>
</html>
