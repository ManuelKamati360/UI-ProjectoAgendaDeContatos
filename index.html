<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="./css/main.css">

    <script src="./js/consumo-api.js" defer></script>
    <script src="./js/renderizarCardsContatos.js" defer></script>
    <!-- <script src="./js/utils.js" defer></script> -->
    <script src="./js/modalDialogoAdicionarContato.js" defer></script>
    <script src="./js/modalDialogoEditarContato.js" defer></script>
    <script src="./js/modalDialogoDeletarContato.js" defer></script>

    <title>Agenda De Contatos</title>
</head>
<body>
    <header id="conteiner-cabecalho">
        <h1>Agenda De Contatos</h1> 

        <nav id="conteiner-buscar-contatos">
            <form action="" method="get" id="frm-buscar-contato">
                <input id="item-txt-caixa-de-busca" type="search" name="search" placeholder="Buscar contato...">
                <button id="item-btn-buscar" type="submit">Buscar</button>
            </form>
        </nav>
    </header>
        
    <main id="conteiner-principal">

        <aside id="conteiner-painel-lateral">
            <div class="item">
                <img src="./img/Bookmark.png" alt="contatos" id="logo-agenda">
                <label for="total" id="total-de-contatos">999.999.999</label>
            </div>
            <div class="item">
                <button type="button" id="btn-adicionar-contato">+</button>                              
            </div>
        </aside>

        <section id="conteiner-painel-central"></section>

    </main>

</body>
</html>
